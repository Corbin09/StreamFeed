# Source definitions loaded into the `sources` table.
# Post content from these sources may be Vietnamese or English.
sources:
  - type: itviec
    name: ITviec - IT jobs
    enabled: true
    interval_minutes: 120
    config:
      keywords: []          # e.g. ["python", "react"] -> /it-jobs/python; empty = all IT jobs
      locations: []         # e.g. ["ha-noi", "ho-chi-minh-hcm"] -> /it-jobs/python/ha-noi
      pages: 3              # listing pages (20 jobs each) per search path
      fetch_details: true   # fetch each job's detail page (description, salary)
      max_posts_per_run: 60

  - type: facebook
    name: Facebook - IT job groups
    enabled: false          # no crawler yet (deferred; see ARCHITECTURE.md §18)
    interval_minutes: 180
    config:
      groups: []            # group URLs or IDs
      max_posts_per_run: 50

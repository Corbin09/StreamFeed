# Source definitions loaded into the `sources` table.
# Post content from these sources may be Vietnamese or English.
sources:
  - type: itviec
    name: ITviec - IT jobs
    enabled: true
    interval_minutes: 120
    config:
      keywords: []          # e.g. ["python", "react"] -> /it-jobs/python; empty = all IT jobs
      locations: []         # e.g. ["ha-noi", "ho-chi-minh-hcm"] -> /it-jobs/python/ha-noi
      pages: 3              # listing pages (20 jobs each) per search path
      fetch_details: true   # fetch each job's detail page (description, salary)
      max_posts_per_run: 60

  - type: facebook
    name: Facebook - IT job groups
    enabled: false          # enable after `python -m app.crawlers.login facebook` and adding groups
    interval_minutes: 1440  # once a day; the run time comes from daily_window
    config:
      groups:               # group URLs, ids or slugs
        - "https://www.facebook.com/groups/268623039201252/"
      max_posts_per_group: 30
      max_scrolls: 12       # scroll steps per group (3-8 s apart)
      max_posts_per_run: 150
      daily_window: "07:00-09:00"  # local time (TIMEZONE), random minute each day

  - type: linkedin
    name: LinkedIn - job search
    enabled: false          # enable after `python -m app.crawlers.login linkedin` (secondary account)
    interval_minutes: 1440  # once a day; the run time comes from daily_window
    config:
      searches:             # LinkedIn job searches, past 24 hours, newest first
        - keywords: "software engineer"
          location: "Vietnam"
        - keywords: "developer"
          location: "Vietnam"
      max_jobs_per_search: 15   # cards clicked per search (3-8 s apart)
      max_posts_per_run: 30
      daily_window: "09:00-11:00"  # local time (TIMEZONE), random minute each day

# Source definitions loaded into the `sources` table.
# Post content from these sources may be Vietnamese or English.
sources:
  - type: itviec
    name: ITviec - IT jobs
    enabled: true
    interval_minutes: 120
    config:
      keywords: []          # e.g. ["python", "react"] -> /it-jobs/python; empty = all IT jobs
      locations: []         # e.g. ["ha-noi", "ho-chi-minh-hcm"] -> /it-jobs/python/ha-noi
      pages: 3              # listing pages (20 jobs each) per search path
      fetch_details: true   # fetch each job's detail page (description, salary)
      max_posts_per_run: 60

  - type: linkedin
    name: LinkedIn - Job search
    enabled: false          # guest search; LinkedIn currently answers 429 to non-browser clients
    interval_minutes: 1440  # once a day; the run time comes from daily_window
    config:
      # One search per keyword, posts from the last 24 hours, newest first.
      keywords: ["software engineer", "developer", "devops", "data engineer", "tester"]
      location: "Vietnam"
      time_range: "r86400"    # f_TPR: r86400 = last 24 hours
      pages_per_keyword: 10   # 10 jobs per page
      max_details_per_run: 100  # full descriptions; other jobs keep the card data
      max_posts_per_run: 300
      daily_window: "07:00-09:00"  # local time (TIMEZONE), random minute each day

  - type: facebook
    name: Facebook - IT job groups
    enabled: false          # no crawler yet (deferred; see ARCHITECTURE.md §18)
    interval_minutes: 180
    config:
      groups: []            # group URLs or IDs
      max_posts_per_run: 50

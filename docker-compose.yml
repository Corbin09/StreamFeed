# Development / single-machine stack. For a server or a public demo, add the production
# override, which closes the database and API ports and requires a login:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamfeed}
      POSTGRES_DB: ${POSTGRES_DB:-streamfeed}
    ports:
      # Loopback only: reachable from this machine (local backend dev), never from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamfeed} -d ${POSTGRES_DB:-streamfeed}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # REST API. Runs migrations and the source seed on start. Never crawls.
  backend:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-streamfeed}:${POSTGRES_PASSWORD:-streamfeed}@postgres:5432/${POSTGRES_DB:-streamfeed}
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Scheduler + queue poller + crawlers (python -m app.worker). The `worker` target adds
  # Google Chrome for BrowserFetcher (Facebook); the API image stays browser-free.
  worker:
    build:
      context: ./backend
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-streamfeed}:${POSTGRES_PASSWORD:-streamfeed}@postgres:5432/${POSTGRES_DB:-streamfeed}
      DATA_DIR: /data
      # Hiring filter for Facebook posts. If Ollama is down, the contact rules decide.
      LLM_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-hf.co/QuantFactory/Arcee-VyLinh-GGUF:Q4_K_M}
    volumes:
      - ./data:/data
    depends_on:
      # The API container applies migrations; wait until it is up.
      backend:
        condition: service_healthy
      ollama:
        condition: service_started
    # Let an in-flight crawl finish on `docker compose stop`; an interrupted run is marked
    # failed by the next worker start (orphan recovery).
    stop_grace_period: 2m
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 512m

  # Local LLM (Ollama, CPU) that decides which Facebook group posts are hiring posts
  # (backend/app/pipeline/llm.py). Pulls LLM_MODEL (~1.9 GB) into the `ollama` volume on the
  # first start; the model stays in RAM (~2.5 GB) for 10 minutes after the last post.
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull "$$LLM_MODEL"; wait
    environment:
      LLM_MODEL: ${LLM_MODEL:-hf.co/QuantFactory/Arcee-VyLinh-GGUF:Q4_K_M}
      OLLAMA_KEEP_ALIVE: 10m
    ports:
      # Loopback only, for dry runs from the host (LLM_URL=http://127.0.0.1:11434).
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Next.js UI. The browser only talks to this service; /api/* is proxied to the backend.
  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      # Optional here; required by docker-compose.prod.yml.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  ollama:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamfeed}
      POSTGRES_DB: ${POSTGRES_DB:-streamfeed}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamfeed} -d ${POSTGRES_DB:-streamfeed}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-streamfeed}:${POSTGRES_PASSWORD:-streamfeed}@postgres:5432/${POSTGRES_DB:-streamfeed}
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # The worker (scheduler) and frontend services are added in later steps.

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamfeed}
      POSTGRES_DB: ${POSTGRES_DB:-streamfeed}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamfeed} -d ${POSTGRES_DB:-streamfeed}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-streamfeed}:${POSTGRES_PASSWORD:-streamfeed}@postgres:5432/${POSTGRES_DB:-streamfeed}
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle: the URL the *browser* uses to reach the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # The worker (scheduler) service is added in step 7.

volumes:
  pgdata:
